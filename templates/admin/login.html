{% extends "base.html" %}
{% block title %}Admin Login — NetMedix{% endblock %}

{% block content %}
<section class="max-w-sm mx-auto px-6 py-24">
  <div class="bg-white p-8 rounded-card border border-hairline">
    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 bg-primary/10 rounded-full flex items-center justify-center mb-4">
        <i data-lucide="shield" class="w-6 h-6 text-primary-deep"></i>
      </div>
      <h1 class="text-xl font-medium tracking-tight text-ink">Admin Login</h1>
      <p class="text-ink-mute text-sm mt-1">Masuk untuk mengelola knowledge base</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-ink mb-1.5">Username</label>
        <input type="text" id="username" name="username"
               class="w-full px-3 py-2 border border-hairline rounded-btn text-sm
                      focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary
                      transition-colors"
               placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-ink mb-1.5">Password</label>
        <input type="password" id="password" name="password"
               class="w-full px-3 py-2 border border-hairline rounded-btn text-sm
                      focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary
                      transition-colors"
               placeholder="Masukkan password" required autocomplete="current-password">
      </div>

      <button type="submit"
              class="w-full bg-primary text-ink font-medium text-sm px-4 py-2.5 rounded-btn
                     hover:bg-primary-deep transition-colors flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Login
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{{ url_for('index') }}" class="text-sm text-ink-mute hover:text-ink transition-colors">
        &larr; Kembali ke Beranda
      </a>
    </div>
  </div>
</section>
{% endblock %}
