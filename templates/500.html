{% extends "base.html" %}
{% block title %}500 — Kesalahan Server — NetMedix{% endblock %}

{% block content %}
<section class="max-w-5xl mx-auto px-6 py-24 text-center">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 text-red-500 mb-6">
    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
  </div>
  <h1 class="text-6xl font-semibold tracking-tight text-ink mb-4">500</h1>
  <h2 class="text-xl font-medium tracking-tight text-ink mb-2">Terjadi Kesalahan Server</h2>
  <p class="text-sm text-ink-mute max-w-md mx-auto mb-8">
    Maaf, terjadi kesalahan internal pada server. Silakan coba lagi beberapa saat.
  </p>
  <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
    <a href="/"
       class="inline-flex items-center gap-2 bg-primary text-white font-medium text-sm px-6 py-3 rounded-btn
              hover:bg-primary-deep transition-colors">
      <i data-lucide="home" class="w-4 h-4"></i>
      Kembali ke Beranda
    </a>
    <a href="/diagnose"
       class="inline-flex items-center gap-2 bg-canvas text-ink font-medium text-sm px-6 py-3 rounded-btn
              border border-hairline hover:bg-canvas-soft transition-colors">
      <i data-lucide="stethoscope" class="w-4 h-4"></i>
      Mulai Diagnosis
    </a>
  </div>
</section>
{% endblock %}
